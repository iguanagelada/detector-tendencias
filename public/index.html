<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Tendências 🎯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg-dark: #0f0f1e;
            --card-dark: #1a1a2e;
            --text-light: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-in;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: white;
            color: var(--primary);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: slideDown 0.6s ease-out;
        }

        select, input[type="text"] {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            background: white;
            color: #333;
        }

        select {
            min-width: 150px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 250px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-search {
            background: white;
            color: var(--primary);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .btn-more {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-more:hover {
            background: white;
            color: var(--primary);
        }

        .btn-more:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-icon {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 10px 15px;
            font-size: 0.9em;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.3);
        }

        .top-controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2em;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-in;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        body.dark-mode .card {
            background: var(--card-dark);
            color: var(--text-light);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            flex: 1;
        }

        body.dark-mode .card-title {
            color: white;
        }

        .card-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        body.dark-mode .card-meta {
            color: #aaa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-likelihood {
            background: var(--primary);
            color: white;
        }

        .badge-platforms {
            background: #f0f0f0;
            color: #333;
        }

        body.dark-mode .badge-platforms {
            background: #333;
            color: #aaa;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .star-btn.favorited {
            color: #ffc107;
        }

        .growth-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }

        body.dark-mode .growth-bar {
            background: #333;
        }

        .growth-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .card-summary {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        body.dark-mode .card-summary {
            color: #bbb;
        }

        .btn-expand {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-expand:hover {
            background: var(--secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-in;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            position: relative;
        }

        body.dark-mode .modal-content {
            background: var(--card-dark);
            color: var(--text-light);
        }

        .modal-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }

        .modal-title {
            font-size: 1.8em;
            color: #333;
        }

        body.dark-mode .modal-title {
            color: white;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
            background: none;
            border: none;
            padding: 0;
        }

        .modal-close:hover {
            color: #333;
        }

        body.dark-mode .modal-close {
            color: #aaa;
        }

        body.dark-mode .modal-close:hover {
            color: white;
        }

        .method-section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        body.dark-mode .method-section {
            background: #0a0a14;
            border-left-color: var(--primary);
        }

        .method-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .method-data {
            color: #666;
            line-height: 1.6;
        }

        body.dark-mode .method-data {
            color: #bbb;
        }

        .data-item {
            margin: 8px 0;
            padding: 5px 0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }

        .history-section {
            margin-bottom: 30px;
        }

        .history-title {
            color: white;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-tag {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .history-tag:hover {
            background: white;
            color: var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            input[type="text"], select {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .modal-content {
                margin: 20px;
                max-height: 90vh;
            }

            .theme-toggle {
                position: static;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            <h1>🎯 Detector de Tendências</h1>
            <p class="subtitle">Encontre as tendências emergentes em tempo real</p>
        </header>

        <div class="controls">
            <select id="nicheSelect" onchange="updateNiche()">
                <option value="gaming">🎮 Gaming</option>
                <option value="tech">💻 Tech</option>
                <option value="crypto">₿ Crypto</option>
            </select>
            <input type="text" id="nicheInput" placeholder="Ou digite um nicho customizado..." value="gaming">
            <button class="btn-search" onclick="searchTrends()">Nova Busca</button>
            <button class="btn-more" id="moreBtn" onclick="generateMore()" disabled>Gerar Mais</button>
        </div>

        <div class="top-controls">
            <button class="btn-icon" onclick="exportData()" title="Exportar como JSON">📥 Exportar</button>
            <button class="btn-icon" onclick="showHistory()" title="Ver histórico">📋 Histórico</button>
        </div>

        <div id="history-section" class="history-section" style="display: none;">
            <div class="history-title">📜 Últimas buscas:</div>
            <div id="history-list" class="history-list"></div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            Buscando tendências...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="grid" class="grid"></div>

        <div id="empty" class="empty" style="display: none;">
            Clique em "Nova Busca" para encontrar tendências
        </div>
    </div>

    <!-- Modal para detalhes -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let currentTrends = [];
        let favoriteIds = new Set();
        let searchHistory = [];

        // Carregar favorites e histórico do localStorage
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('favorites');
            if (saved) favoriteIds = new Set(JSON.parse(saved));
            const hist = localStorage.getItem('history');
            if (hist) searchHistory = JSON.parse(hist);
            applyTheme();
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function applyTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) document.body.classList.add('dark-mode');
        }

        function updateNiche() {
            const select = document.getElementById('nicheSelect');
            const input = document.getElementById('nicheInput');
            input.value = select.value;
        }

        async function searchTrends() {
            const niche = document.getElementById('nicheInput').value || 'gaming';
            await fetchTrends(niche);
            addToHistory(niche);
        }

        async function generateMore() {
            const niche = document.getElementById('nicheInput').value || 'gaming';
            await fetchTrends(niche);
            addToHistory(niche);
        }

        function addToHistory(niche) {
            const timestamp = new Date().toLocaleString('pt-BR');
            searchHistory.unshift({ niche, timestamp });
            searchHistory = searchHistory.slice(0, 10);
            localStorage.setItem('history', JSON.stringify(searchHistory));
        }

        function showHistory() {
            const section = document.getElementById('history-section');
            const list = document.getElementById('history-list');

            if (searchHistory.length === 0) {
                section.style.display = 'none';
                return;
            }

            list.innerHTML = searchHistory.map((item, idx) => `
                <div class="history-tag" onclick="document.getElementById('nicheInput').value='${item.niche}'; searchTrends();" title="${item.timestamp}">
                    ${item.niche}
                </div>
            `).join('');

            section.style.display = 'block';
        }

        async function fetchTrends(niche) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const grid = document.getElementById('grid');
            const empty = document.getElementById('empty');

            loading.style.display = 'block';
            error.style.display = 'none';
            grid.innerHTML = '';
            empty.style.display = 'none';

            try {
                const response = await fetch('/api/search-trends', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niche })
                });

                if (!response.ok) throw new Error('Erro na busca');

                const data = await response.json();
                currentTrends = data.mega_trends || [];

                loading.style.display = 'none';

                if (currentTrends.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                renderTrends();
                document.getElementById('moreBtn').disabled = false;

            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `❌ Erro: ${err.message}`;
                console.error('Erro:', err);
            }
        }

        function renderTrends() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            currentTrends.forEach(trend => {
                const isFav = favoriteIds.has(trend.id);
                const growthPercent = Math.min((trend.likelihood || 80) * 1.25, 100);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div style="flex: 1;">
                            <div class="card-title">${escapeHtml(trend.name)}</div>
                            <div class="card-meta">
                                <span class="badge badge-likelihood">📈 ${Math.round(trend.likelihood || 80)}%</span>
                                <span class="badge badge-platforms">🌐 ${trend.platforms || 1} plataformas</span>
                            </div>
                        </div>
                        <button class="star-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${trend.id}')" title="Favoritar">
                            ${isFav ? '⭐' : '☆'}
                        </button>
                    </div>
                    <div class="growth-bar">
                        <div class="growth-fill" style="width: ${growthPercent}%"></div>
                    </div>
                    <div class="card-summary">
                        <strong>Status:</strong> ${escapeHtml(trend.growth || 'acelerando')}<br>
                        <strong>Métodos:</strong> ${trend.data ? Object.keys(trend.data).filter(k => Array.isArray(trend.data[k]) && trend.data[k].length > 0).length : 0} ativos
                    </div>
                    <button class="btn-expand" data-trend='${JSON.stringify(trend).replace(/'/g, "&apos;")}' onclick="openModalFromData(this)">
                        Ver Detalhes
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function toggleFavorite(id) {
            if (favoriteIds.has(id)) {
                favoriteIds.delete(id);
            } else {
                favoriteIds.add(id);
            }
            localStorage.setItem('favorites', JSON.stringify([...favoriteIds]));
            renderTrends();
        }

        function openModalFromData(button) {
            const trendStr = button.getAttribute('data-trend');
            const trend = JSON.parse(trendStr);
            openModal(trend);
        }

        function openModal(trend) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = escapeHtml(trend.name);

            let html = '';
            if (trend.data) {
                const methods = {
                    'google_trends': '🔍 Google Trends',
                    'youtube_iguana': '🎬 YouTube (VidIQ)',
                    'google_autocomplete': '🌐 Google Autocomplete',
                    'youtube_autocomplete': '▶️ YouTube Autocomplete'
                };

                Object.entries(methods).forEach(([key, label]) => {
                    if (trend.data[key] && trend.data[key].length > 0) {
                        html += `<div class="method-section">
                            <div class="method-title">${label}</div>
                            <div class="method-data">`;

                        trend.data[key].forEach(item => {
                            if (item.query) {
                                html += `<div class="data-item">• ${escapeHtml(item.query)}</div>`;
                            } else if (item.title) {
                                html += `<div class="data-item"><strong>${escapeHtml(item.title)}</strong><br>📊 ${item.views || 0} views | 🚀 ${item.vph || 0} VPH</div>`;
                            }
                        });

                        html += `</div></div>`;
                    }
                });
            }

            modalBody.innerHTML = html || '<p class="empty">Nenhum dado disponível</p>';
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function exportData() {
            if (currentTrends.length === 0) {
                alert('Nenhuma tendência para exportar. Faça uma busca primeiro!');
                return;
            }

            const jsonData = {
                timestamp: new Date().toISOString(),
                trends: currentTrends,
                niche: document.getElementById('nicheInput').value
            };

            const dataStr = JSON.stringify(jsonData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `trends-${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Mostrar histórico ao carregar
        showHistory();
    </script>
</body>
</html>
