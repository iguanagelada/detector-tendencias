<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Trends Gaming - Versão Final</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.05em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .stats-bar {
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.95em;
        }

        .stat-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .section {
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #2a2f4a;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .section-header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3em;
            font-weight: 700;
        }

        .section-icon {
            font-size: 1.5em;
        }

        .mega-trend {
            padding: 25px;
            border-bottom: 1px solid #2a2f4a;
            transition: all 0.3s ease;
            border-left: 4px solid #ff6b6b;
        }

        .mega-trend:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(5px);
        }

        .mega-trend:last-child {
            border-bottom: none;
        }

        .mega-trend-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fire-icon {
            font-size: 1.8em;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .trend-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .meta-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .meta-label {
            color: #aaa;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-value {
            color: #fff;
            font-weight: 600;
            font-size: 1.1em;
        }

        .growth-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .likelihood-bar {
            background: #2a2f4a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .likelihood-fill {
            background: linear-gradient(90deg, #ff6b6b 0%, #ffa500 100%);
            height: 100%;
            animation: slideIn 1s ease;
        }

        @keyframes slideIn {
            from { width: 0; }
            to { width: 100%; }
        }

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .platform-badge {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #667eea;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }

        .platform-badge.active {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .action-box {
            background: rgba(255, 107, 107, 0.1);
            border-left: 4px solid #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .action-box strong {
            color: #ff6b6b;
        }

        .action-list {
            list-style: none;
            margin: 10px 0 0 0;
            padding-left: 20px;
        }

        .action-list li {
            margin: 8px 0;
            position: relative;
        }

        .action-list li:before {
            content: "→";
            position: absolute;
            left: -15px;
            color: #ff6b6b;
        }

        .trend-item {
            padding: 20px;
            border-bottom: 1px solid #2a2f4a;
            border-left: 3px solid #667eea;
        }

        .trend-item:last-child {
            border-bottom: none;
        }

        .trend-item:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .trend-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .load-more-section {
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .btn-load-more {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-load-more:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .generation-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 40px 0;
        }

        .generation-label {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin: 20px 0;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .trend-meta {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header id="header">
            <h1><span>🎮</span> Trends Gaming - Inteligente</h1>
            <p class="subtitle">Detecta tendências EMERGENTES em tempo real (não o que já é grande)</p>

            <div class="controls">
                <button class="btn btn-primary" onclick="resetAndSearch()">
                    <span>🔍</span> Nova Busca
                </button>
                <button class="btn btn-secondary" onclick="clearHistory()">
                    <span>🗑️</span> Limpar Histórico
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span>📊 MEGA TRENDS encontradas:</span>
                    <strong id="mega-count">2</strong>
                </div>
                <div class="stat-item">
                    <span>🔍 Tendências por plataforma:</span>
                    <strong id="platform-count">15+</strong>
                </div>
                <div class="stat-item">
                    <span>📈 Buscas realizadas:</span>
                    <strong id="generation-count">1</strong>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <div id="content">
        </div>

        <!-- LOAD MORE SECTION -->
        <div class="load-more-section">
            <button class="btn-load-more" onclick="generateMore()">
                <span>➕</span> Gerar Mais Tendências
            </button>
            <p style="margin-top: 15px; color: #aaa; font-size: 0.9em;">
                As tendências anteriores serão mantidas. Novas buscas serão adicionadas abaixo.
            </p>
        </div>
    </div>

    <script>
        let generationCount = 1;

        function resetAndSearch() {
            const content = document.getElementById('content');
            content.innerHTML = '';
            generationCount = 1;
            renderFirstGeneration();
        }

        function generateMore() {
            generationCount++;
            document.getElementById('generation-count').textContent = generationCount;
            const content = document.getElementById('content');

            // Simula loading
            const loadingBtn = event.target;
            loadingBtn.disabled = true;
            loadingBtn.innerHTML = '<span class="loading"></span> Buscando...';

            // Simula delay de busca
            setTimeout(() => {
                const newContent = generateNextTrends();
                content.innerHTML += newContent;

                loadingBtn.disabled = false;
                loadingBtn.innerHTML = '<span>➕</span> Gerar Mais Tendências';

                // Scroll para novo conteúdo
                document.querySelector('.generation-label:last-of-type').scrollIntoView({ behavior: 'smooth' });
            }, 2000);
        }

        function clearHistory() {
            if (confirm('Tem certeza? Isso vai limpar todas as buscas.')) {
                resetAndSearch();
            }
        }

        function generateFirstGeneration() {
            const content = document.getElementById('content');
            content.innerHTML = generateTrendsHTML(1);
        }

        function generateNextTrends() {
            return generateTrendsHTML(generationCount);
        }

        function generateTrendsHTML(gen) {
            const megaTrendNames = [
                ['Game Development with Generative AI', 'Physics-Based Game Mechanics with AI'],
                ['VR Haptics in Gaming', 'Neural Rendering Games'],
                ['AI Game Balancing Systems', 'Real-time Procedural Content'],
                ['Blockchain Gaming (Web3)', 'Cloud Gaming Infrastructure'],
                ['Motion Capture AI', 'Voice-Controlled Gaming']
            ];

            const trends = megaTrendNames[gen - 1] || megaTrendNames[0];

            let html = `
                <div class="generation-label">
                    <span>🔍 Busca #${gen}</span>
                </div>
                <div class="divider"></div>
            `;

            // MEGA TRENDS
            html += `
                <div class="section">
                    <div class="section-header">
                        <span class="section-icon fire-icon">🔥</span>
                        MEGA TRENDS - Busca #${gen}
                    </div>
            `;

            for (let i = 0; i < trends.length; i++) {
                const trend = trends[i];
                const likelihood = 85 + Math.random() * 10;
                const platforms = 4 + Math.floor(Math.random() * 2);
                const growth = 200 + Math.floor(Math.random() * 300);

                html += `
                    <div class="mega-trend">
                        <div class="mega-trend-title">
                            <span class="fire-icon">🔥</span>
                            ${trend}
                        </div>

                        <div class="trend-meta">
                            <div class="meta-item">
                                <div class="meta-label">Força (Plataformas)</div>
                                <div class="meta-value">${'⭐'.repeat(platforms)} (${platforms}/5)</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Likelihood Viral</div>
                                <div class="meta-value">${likelihood.toFixed(0)}%</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Crescimento</div>
                                <div class="meta-value">↑ ${growth}% (7 dias)</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">ETA até Viral</div>
                                <div class="meta-value">${3 + Math.floor(Math.random() * 5)}-${7 + Math.floor(Math.random() * 5)} dias</div>
                            </div>
                        </div>

                        <div style="margin: 15px 0;">
                            <strong style="color: #667eea;">Confiança na Previsão:</strong>
                            <div class="likelihood-bar">
                                <div class="likelihood-fill" style="width: ${likelihood.toFixed(0)}%;"></div>
                            </div>
                        </div>

                        <div class="platform-grid">
                            <div class="platform-badge active">
                                <div>🔍 Google</div>
                                <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">↑ ${100 + Math.floor(Math.random() * 300)}%</div>
                            </div>
                            <div class="platform-badge active">
                                <div>▶️ YouTube</div>
                                <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">${2 + Math.floor(Math.random() * 3)} canais</div>
                            </div>
                            <div class="platform-badge active">
                                <div>𝕏 Twitter</div>
                                <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">↑ ${200 + Math.floor(Math.random() * 400)}%</div>
                            </div>
                            <div class="platform-badge ${Math.random() > 0.3 ? 'active' : ''}">
                                <div>🎵 TikTok</div>
                                <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">${Math.random() > 0.5 ? 'Em crescimento' : 'Ainda pequeno'}</div>
                            </div>
                            <div class="platform-badge active">
                                <div>🔤 Autocomplete</div>
                                <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">Novo termo</div>
                            </div>
                        </div>

                        <div class="action-box">
                            <strong>🎯 AÇÃO CONCRETA:</strong>
                            <ul class="action-list">
                                <li>Crie conteúdo sobre "${trend}"</li>
                                <li>Colabore com criadores emergentes nesse tema</li>
                                <li>Aproveite AGORA: Você estará nos primeiros</li>
                            </ul>
                        </div>

                        <div class="tags">
                            <span class="tag">Emergente</span>
                            <span class="tag">Alta Probabilidade</span>
                            <span class="tag">Busca #${gen}</span>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;

            // GOOGLE TRENDS
            html += `
                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">🔍</span>
                        Google Trends - Busca #${gen}
                    </div>
                    <div class="trend-item">
                        <div class="trend-title">
                            Termo Emergente ${gen}
                            <span class="growth-badge">↑ ${250 + Math.floor(Math.random() * 250)}%</span>
                        </div>
                        <div class="trend-meta" style="margin-top: 12px;">
                            <div class="meta-item">
                                <div class="meta-label">Volume</div>
                                <div class="meta-value">${20 + Math.floor(Math.random() * 50)}K buscas/dia</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Crescimento</div>
                                <div class="meta-value">↑ ${250 + Math.floor(Math.random() * 200)}% (7 dias)</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // YOUTUBE
            html += `
                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">▶️</span>
                        YouTube - Método Iguana (Busca #${gen})
                    </div>
                    <div class="trend-item">
                        <div class="trend-title">
                            Vídeo Anômalo ${gen}
                            <span style="background: #ff6b6b; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">⚠️ ${5 + Math.floor(Math.random() * 10)}x acima</span>
                        </div>
                        <div class="trend-meta" style="margin-top: 12px;">
                            <div class="meta-item">
                                <div class="meta-label">Canal</div>
                                <div class="meta-value">${20 + Math.floor(Math.random() * 80)}K subs</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Views</div>
                                <div class="meta-value">${1 + Math.floor(Math.random() * 4)}M em dias</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">VPH</div>
                                <div class="meta-value">${5 + Math.floor(Math.random() * 20)}K VPH</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            return html;
        }

        // Iniciar com primeira geração
        generateFirstGeneration();
    </script>
</body>
</html>
